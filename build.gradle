plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.capstone'
version = '0.0.1-SNAPSHOT'
description = 'Passfolio'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Default
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Security
//    implementation 'org.springframework.boot:spring-boot-starter-security'

	// DB
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// ORM
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Mail + HTML templates (시스템 로그인 이메일 인증)
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	// Swagger
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13")

	// AWS Dependency
	// https://mvnrepository.com/artifact/io.awspring.cloud/spring-cloud-aws-starter-s3
	implementation("io.awspring.cloud:spring-cloud-aws-starter-s3:3.4.0")
	implementation 'software.amazon.awssdk:sfn:2.25.64' // Step Function
	implementation 'software.amazon.awssdk:sqs:2.31.54' // SQS (분석 작업 디스패치)
	implementation 'software.amazon.awssdk:kms:2.31.54' // KMS (GitHub 토큰 암호화 → Lambda)

	// SMS (배치 완료 알림) — CoolSMS(솔라피) 국내 발송
	implementation 'net.nurigo:sdk:4.3.0'

	// QueryDSL
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// OAuth2 Client
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// Batch
	implementation 'org.springframework.boot:spring-boot-starter-batch'

	// RabbitMQ
//	implementation 'org.springframework.boot:spring-boot-starter-amqp'

	// Mutex (Distributed Lock)
	implementation 'org.redisson:redisson-spring-boot-starter:3.27.0'

	// L1 Cache (Caffeine Cache)
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// Rate Limiter (Bucket4j)
	implementation("com.bucket4j:bucket4j_jdk17-core:8.14.0")
	implementation("com.bucket4j:bucket4j_jdk17-redis-common:8.14.0")
	implementation("com.bucket4j:bucket4j_jdk17-lettuce:8.14.0")

	// Metrics (Micrometer + Prometheus)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	//testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.awaitility:awaitility:4.2.0'

	// Test Database (H2 for @DataJpaTest)
	testRuntimeOnly 'com.h2database:h2'

	testCompileOnly "org.projectlombok:lombok"
	testAnnotationProcessor "org.projectlombok:lombok"
}



tasks.named('test') {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

// ───── Jacoco 설정 ─────
// 목적: backlog BE-file-aws-s3-multipart-upload-presigned-url 의 acceptance signal
//       "Jacoco ≥ 80% line coverage on the new domain.file + domain.s3 packages" 충족.
// 설계 원칙(0001-harness-design.md §Decisions): 검증 규칙(scope)은 신규 코드(domain.file
//       + domain.s3)에만 한정한다 — 레거시 미검증 코드가 게이트를 막지 않도록.
// 리포트(jacocoTestReport)는 전체 main classpath 기준으로 항상 생성한다.
jacoco {
	toolVersion = "0.8.11" // 0.8.11+ 가 Java 21 bytecode 지원
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')

	reports {
		html.required = true
		xml.required  = true
		csv.required  = false
	}

	// 측정 노이즈 제거 — 비즈니스 로직 없는 클래스는 리포트에서도 빼서 신호 흐려지지 않게.
	def reportExcludes = [
			'**/*Application*',
			'**/Q*.*',          // QueryDSL 자동 생성
			'**/config/**',
			'**/dto/**',
			'**/exception/**',
			'**/model/**'
	]

	classDirectories.setFrom(
			files(classDirectories.files.collect {
				fileTree(dir: it, exclude: reportExcludes)
			})
	)
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('jacocoTestReport')

	violationRules {
		// 신규 패키지 한정 LINE ≥ 0.80 룰. includes 패턴은 패키지명을 fully-qualified
		// (슬래시가 아닌 점 표기)로 매칭한다. 클래스 단위로 평가하면 한 클래스라도
		// 80% 미만이면 실패하므로, BUNDLE 단위로 두 패키지 합산 평균이 80% 이상이면
		// 통과하도록 element='BUNDLE' + includes 로 BUNDLE 의 measured 영역을 좁힌다.
		rule {
			element  = 'BUNDLE'
			includes = ['**']

			limit {
				counter = 'LINE'
				value   = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}

	// 룰 평가 대상 클래스 자체를 신규 패키지로 좁힌다. 이렇게 하면 BUNDLE 의
	// LINE 분모에 들어가는 라인이 domain.file + domain.s3 의 라인만 남고,
	// dto/config/exception 같은 비즈니스 없는 클래스는 자동 제외된다.
	def verificationIncludes = [
			'com/capstone/passfolio/domain/file/**',
			'com/capstone/passfolio/domain/s3/**'
	]
	def verificationExcludes = [
			'**/dto/**',         // 단순 DTO record/POJO
			'**/entity/enums/**' // MediaType 같은 단순 enum
	]

	classDirectories.setFrom(
			files(sourceSets.main.output.classesDirs.collect {
				fileTree(dir: it, includes: verificationIncludes, excludes: verificationExcludes)
			})
	)
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}
