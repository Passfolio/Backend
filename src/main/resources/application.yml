server: # t3.small environment setup -> need to be optimized
  tomcat:
    threads:
      max: 120
      min-spare: 20

spring:
  # Time Zone Setup ---------------------------------------------------------
  jackson:
    time-zone: UTC # 모든 시간대 응답을 UTC로 통일
    serialization:
      write-dates-as-timestamps: false # WHAT

  # Run Profile Environment
  profiles:
    active: dev # 개발할 때는 dev, 배포할 때는 prod

  # Database Setup ---------------------------------------------------------
  ## RDB Setup ---------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?reWriteBatchedInserts=true&stringtype=unspecified
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: 6 # HikariCP Recommendation : vCPU * 2 + alpha
      minimum-idle: 6       # 고정해두는 게 튀는 부하 방지에 유리
      connection-timeout: 30000 # wait 30s

  flyway:
    enabled: true
    baseline-on-migrate: true

  ## NoSQL (Redis) Setup ---------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8 # 48
          max-idle: 8 # 32
          min-idle: 2 # 8
          max-wait: 1000ms # 5000ms

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    group: ${MAIL_GROUP:Passfolio}
    properties:
      mail:
        smtp:
          # Gmail 등: auth=true, starttls=true, port 587 / MailHog: auth=false, starttls=false, port 1025
          auth: ${MAIL_SMTP_AUTH:false}
          debug: false
          connectiontimeout: 10000
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          writetimeout: 10000
          timeout: 10000

  # AWS Storage Setup ---------------------------------------------------------
  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET_NAME}
      region:
        static: ap-northeast-2

  # Security Setup ---------------------------------------------------------
  ## OAuth2 Setup
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${OAUTH_GITHUB_CLIENT_ID}
            client-secret: ${OAUTH_GITHUB_CLIENT_SECRET}
            client-name: GitHub
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - read:user
              - user:email
              - repo
              - read:org

# Utils Section ----------------------------------------------
app:
  cookie:
    secure: false
    cookie-atk: "ATK"
    cookie-rtk: "RTK"
    same-site: "Strict"
    atk-apply-path: "/"
    rtk-apply-path: "/api/v1"

  # Ex: "http://localhost:5173/oauth/callback,https://domain.com/oauth/callback"
  front-redirect-uri: "${FRONT_REDIRECT_URI:http://localhost:5173/oauth/callback}"
  # Ex: "http://localhost:5173,https://domain.com"
  front-base-url: "${FRONT_BASE_URL:http://localhost:5173}"
  allowed-origins: "${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}"
  backend-base-url: "${BACKEND_BASE_URL:http://localhost:8080}"

  # 시스템 로그인(이메일+비밀번호): 테스트·관리자 확장. 운영에서는 false 권장.
  system-auth:
    enabled: ${SYSTEM_AUTH_ENABLED:false}
    # .env SYSTEM_AUTH_EMAIL_ALLOWLIST=a@x.com,b@y.com — 가입·메일 발송·코드 검증 모두 이 목록에 있는 이메일만 허용. 비어 있으면 전부 거절.
    email-allowlist: ${SYSTEM_AUTH_EMAIL_ALLOWLIST:}

  # 공공데이터포털 — 대학·학과 정보 (tn_pubr_public_univ_major_api)
  gov-data:
    univ-major:
      base-url: "https://api.data.go.kr/openapi/tn_pubr_public_univ_major_api"
      service-key: ${APP_GOV_DATA_UNIV_SERVICE_KEY:}

hmac:
  secret: ${HMAC_SECRET_KEY} # at least 32 characters long

cdn:
  base-url: ${CDN_BASE_URL:} # CDN이 있다면 설정, 없으면 빈 문자열 (S3 URL 사용)

# File Upload Policy ----------------------------------------------------------
# Direct-to-S3 multipart upload via presigned URL.
# 백로그 제약: PDF + 이미지 + 비디오 화이트리스트, 100MB 한도, presigned URL 단기 TTL.
# FileUploadProperties(@ConfigurationProperties prefix="file.upload")가 이 블록을 바인딩.
# 환경변수로 운영팀이 재배포 없이 override 할 수 있도록 모든 키에 default 제공.
file:
  upload:
    # 콤마 구분 문자열 → List<String> 자동 바인딩. 점 없이, 소문자 권장.
    allowed-extensions: ${FILE_UPLOAD_ALLOWED_EXTENSIONS:pdf,jpg,jpeg,png,gif,webp,bmp,svg,mp4,mov,webm,avi,wmv,flv,mkv}
    # 비즈니스 허용 최대 파일 크기 (bytes). 100MB = 104857600.
    max-file-size-bytes: ${FILE_UPLOAD_MAX_FILE_SIZE_BYTES:104857600}
    # Presigned URL 만료시간 (분). file_security.md §3 권장: ≤ 15분.
    presigned-url-ttl-minutes: ${FILE_UPLOAD_PRESIGNED_TTL_MIN:10}
    # 확장자가 없는 파일을 허용할지. 기본 false (확장자 화이트리스트 우회 방지).
    allow-files-with-no-extension: ${FILE_UPLOAD_ALLOW_NO_EXT:false}

### OAuth2
github:
  token:
    encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY} # AES-256 key (32 bytes, Base64 encoded)
    ttl-hours: 8
  cache:
    repos-ttl-minutes: 5

ratelimit:
  enabled: true
  redis:
    timeout-fail-open: 200ms     # limiter 장애 시 빠르게 통과
    timeout-fail-closed: 500ms   # auth는 차단하되 짧게 실패
  expiration:
    refill-to-max-jitter: 10s
  failure:
    mode: FAIL_OPEN             # ??? FAIL_OPEN, auth? ????? failClosed=true? ???
  key:
    namespace: ratelimit
    user-prefix: user
    ip-prefix: ip
  logging:
    backend-error-min-interval-ms: 1000
  proxy:
    trusted-cidrs: ${TRUSTED_CIDRS} # ex. 172.18.0.0/20,172.39.16.0/20, ...

# Monitoring Setup ------------------------------------------------------------
management:
  endpoints:
    web:
      base-path: ${ACTUATOR_ENDPOINT} # Custom Path
      exposure:
        include: "health,prometheus" # health? prometheus? ?? (env, beans ? ??)
  endpoint:
    health:
      show-details: always # DB, Disk, Redis -> Detail Connection Status
    prometheus:
      enabled: true # Prometheus Scrape ???
  metrics:
    tags:
      application: ${spring.application.name:Passfolio}

# AI Service
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  internal-api-key: ${PASSFOLIO_INTERNAL_API_KEY}

# Discord 관측 알림(선택) — FastAPI 포폴 호출/완료 웹훅 가시화. 미설정이면 no-op.
discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}

# Project Analysis (Lambda 연동) — 분석 완료 웹훅 검증용 별도 내부 키.
# 값은 Lambda와 공유(운영: Secrets Manager/KMS, 로컬/dev: 환경변수).
project-analysis:
  internal-api-key: ${PROJECT_ANALYSIS_INTERNAL_API_KEY:local-dev-internal-key}

# AWS Service
aws:
  stepfunction:
    arn: ${STEP_FUNCTION_ARN:}
  sqs:
    analysis-queue-url: ${AWS_SQS_ANALYSIS_QUEUE_URL:}   # DevSkill 분석 작업 큐(Lambda 트리거)
    precheck-queue-url: ${AWS_SQS_PRECHECK_QUEUE_URL:}   # 사전 점검 작업 큐(Lambda PRECHECK 트리거)
  kms:
    # GitHub 토큰 암호화 CMK(Lambda와 공유). 실제 값은 운영 APPLICATION_YML secret이 소스.
    # 키 ARN 권장(alias가 'alias/alias/...' 이중 prefix라 모호). 리포엔 구체값 미커밋.
    token-key-id: ${AWS_KMS_TOKEN_KEY_ID}

# SMS 발송 — CoolSMS(솔라피). 배치 완료 알림 문자.
sms:
  coolsms:
    enabled: ${SMS_COOLSMS_ENABLED:false}                # 개발 false=로그만, 실발송 시 true
    base-url: ${SMS_COOLSMS_BASE_URL:https://api.solapi.com}
    api-key: ${SMS_COOLSMS_API_KEY:}
    api-secret: ${SMS_COOLSMS_API_SECRET:}
    from: ${SMS_COOLSMS_FROM:}                            # 솔라피에 등록한 발신번호(로컬 형식, 예: 01012345678)

# Project Analysis 디스패치(admission 페이서 + 토큰 유효성 임계값 + Lambda 공유 키)
analysis:
  dispatch:
    # (토큰 재암호화는 KMS로 — 위 aws.kms.token-key-id 참조. 원시 AES 공유키 미사용.)
    # Redisson RRateLimiter: interval(초)당 rate 건만 디스패치 허용(초과 시 429).
    rate-limit: ${ANALYSIS_DISPATCH_RATE:30}
    rate-interval-seconds: ${ANALYSIS_DISPATCH_INTERVAL_SECONDS:60}
    # repo 크기 상한(KB). GitHub size 기준 coarse 차단(정밀 100MB 작업트리는 Lambda clone에서).
    max-repo-size-kb: ${ANALYSIS_MAX_REPO_SIZE_KB:1048576}  # 1GiB(git history 상한)
    # 분석 전 GitHub 토큰이 최소 이 시간 이상 남아있어야 함(분석 소요+큐 대기 여유).
    min-token-ttl-minutes: ${ANALYSIS_MIN_TOKEN_TTL_MINUTES:30}
    # 배치 완료 추적 Redis 카운터 TTL(시간). stale-timeout보다 충분히 길게.
    batch-ttl-hours: ${ANALYSIS_BATCH_TTL_HOURS:6}
    # stale 안전망: IN_PROGRESS가 이 시간 이상 정체되면 실패 처리(Lambda 최대 15분 → 여유).
    stale-timeout-minutes: ${ANALYSIS_STALE_TIMEOUT_MINUTES:30}
  # NONSTOP 핸드오프: FastAPI에 넘길 분석 JSON을 presigned S3 URL로 변환(Cloudflare 봇룰 우회).
  artifact:
    # DevSkill이 분석 결과 JSON을 올리는 버킷(= DevSkill OUTPUT_BUCKET). BE 역할에 s3:GetObject 필요.
    output-bucket: ${ANALYSIS_OUTPUT_BUCKET:devskill-analysis-output-911167931692}
    # presigned GET URL 만료(분). FastAPI 백그라운드 큐 지연 대비 업로드용(10분)보다 길게.
    presign-ttl-minutes: ${ANALYSIS_PRESIGN_TTL_MINUTES:60}
  admin-test:
    # 여기 등록된 username(=가입 이메일, 소문자) 만 최대 300개 디스패치 가능. 그 외 ADMIN은 11개 제한.
    # 콤마 구분. 미설정 시 전원 11개로 제한. 예: ANALYSIS_ADMIN_TEST_PRIVILEGED_USERNAMES=owner@example.com
    privileged-usernames: ${ANALYSIS_ADMIN_TEST_PRIVILEGED_USERNAMES:}

# Swagger (Prod에선 Open 비활성화: 릴리즈 전까지만 오픈->주석처리)
springdoc:
  swagger-ui:
    path: ${SWAGGER_UI_PATH}   # UI
#      enabled: false
  api-docs:
    path: ${SWAGGER_JSON_PATH}  # JSON
#      enabled: false
# TODO: MANAGER 계정만 Swagger Path 허용
