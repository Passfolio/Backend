<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Passfolio 이메일 인증</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <style>
        td, th, div, p, span, a { mso-line-height-rule: exactly; }
    </style>
    <![endif]-->
</head>
<body style="margin:0; padding:0; width:100%; background-color:#F2F4F7; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">

<!-- 받은편지함 미리보기 텍스트 (대부분의 클라이언트가 본문 첫 줄을 미리보기로 노출) -->
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#F2F4F7;">
    Passfolio 이메일 인증번호입니다. 5분간 유효합니다.
</div>

<table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#F2F4F7"
       style="background-color:#F2F4F7; border-collapse:collapse;">
    <tr>
        <td align="center" style="padding:40px 16px;">

            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#FFFFFF"
                   style="max-width:480px; background-color:#FFFFFF; border:1px solid #E5E7EB; border-radius:12px; border-collapse:separate;">
                <tr>
                    <td align="center" bgcolor="#FFFFFF"
                        style="background-color:#FFFFFF; padding:40px 32px 24px 32px;
                               font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
                               font-size:24px; line-height:1.2; color:#111827; font-weight:700; letter-spacing:-0.01em;">
                        Passfolio
                    </td>
                </tr>
                <tr>
                    <td align="center" bgcolor="#FFFFFF"
                        style="background-color:#FFFFFF; padding:0 32px 8px 32px;
                               font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
                               font-size:20px; line-height:1.4; color:#111827; font-weight:600;">
                        이메일 인증
                    </td>
                </tr>
                <tr>
                    <td align="center" bgcolor="#FFFFFF"
                        style="background-color:#FFFFFF; padding:0 32px 28px 32px;
                               font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
                               font-size:14px; line-height:1.6; color:#4B5563;">
                        아래 인증번호를 입력해 이메일 인증을 완료하세요.
                    </td>
                </tr>
                <tr>
                    <td align="center" bgcolor="#FFFFFF" style="background-color:#FFFFFF; padding:0 32px 0 32px;">
                        <table role="presentation" border="0" cellspacing="0" cellpadding="0" align="center"
                               style="border-collapse:separate; margin:0 auto;">
                            <tr>
                                <td align="center" bgcolor="#F3F4F6"
                                    style="background-color:#F3F4F6; border:1px solid #E5E7EB; border-radius:10px;
                                           padding:18px 28px;
                                           font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
                                    <!-- letter-spacing 만큼 padding-left 으로 중앙 시각 보정 -->
                                    <span id="verificationCode"
                                          style="display:inline-block; font-size:30px; font-weight:700;
                                                 letter-spacing:10px; padding-left:10px;
                                                 color:#111827;"
                                          th:text="${verificationCode}">000000</span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td align="center" bgcolor="#FFFFFF"
                        style="background-color:#FFFFFF; padding:24px 32px 6px 32px;
                               font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
                               font-size:13px; line-height:1.6; color:#6B7280;">
                        인증번호는 <span style="color:#2563EB; font-weight:600;">5분간</span> 유효합니다.
                    </td>
                </tr>
                <tr>
                    <td align="center" bgcolor="#FFFFFF"
                        style="background-color:#FFFFFF; padding:0 32px 36px 32px;
                               font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
                               font-size:12px; line-height:1.6; color:#9CA3AF;">
                        본인이 요청하지 않았다면 이 메일을 무시해도 안전합니다.
                    </td>
                </tr>
            </table>

            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
                   style="max-width:480px; border-collapse:collapse;">
                <tr>
                    <td align="center"
                        style="padding:20px 16px 0 16px;
                               font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
                               font-size:12px; line-height:1.6; color:#9CA3AF;">
                        &copy; Passfolio
                    </td>
                </tr>
            </table>

        </td>
    </tr>
</table>
</body>
</html>
