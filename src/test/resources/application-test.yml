# 통합/E2E 테스트 공통 프로파일.
# 활성화: @ActiveProfiles("test") 또는 AbstractIntegrationTest 상속.
#
# 설계 원칙:
#  - application.yml 의 ${ENV} placeholder 가 들어가는 라인을 모두 override 하여
#    실제 환경변수(.env) 의존을 제거한다.
#  - 외부 인프라(Postgres / Redis / S3 / SMTP) 의존을 컨텍스트 부팅에서 차단한다:
#      · DB → H2 in-memory (PostgreSQL 호환 모드)
#      · Redis / S3 → AbstractIntegrationTest 의 @MockitoBean 으로 차단
#      · SMTP → JavaMailSender 는 호출 시점 전까지 연결 시도 안 함 (mailhog 가짜 호스트 OK)
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:passfolio-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      # H2 는 'SET TIME ZONE' 구문이 없음 → application.yml 의 init SQL 을 빈 문자열로 override
      connection-init-sql: ""

  flyway:
    enabled: false # V1__init_pg_trgm_*.sql 은 PostgreSQL 전용 (pg_trgm extension)

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        show_sql: false

  mail:
    host: localhost
    port: 1025

  cloud:
    aws:
      s3:
        bucket: test-bucket
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-github-id
            client-secret: test-github-secret

  batch:
    job:
      enabled: false

# application.yml 의 ${ACTUATOR_ENDPOINT} 자리채우기
management:
  endpoints:
    web:
      base-path: /internal/actuator

# application.yml 의 ${SWAGGER_*} 자리채우기
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# JWT 는 application-dev.yml / application-prod.yml 에만 정의 → test 에서 명시 필요
jwt:
  secret: ZGV2LXRlc3Qtand0LXNlY3JldC1iYXNlNjQtZW5jb2RlZC1tdXN0LWJlLWxvbmctZW5vdWdoLWZvci1obWFjLXNoYTUxMg==
  atk-exp-min: 30
  rtk-exp-week: 2

hmac:
  secret: test-hmac-secret-must-be-at-least-32-chars-long

# cdn.base-url 은 ArticleE2ETest 의 thumbnail/cleanup 검증에서 prefix strip 동작에 필요
cdn:
  base-url: https://cdn.passfolio.test

# AesEncryptor 는 base64 디코딩 결과가 정확히 32 bytes 여야 함
# 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' = '0123456789abcdef0123456789abcdef'
github:
  token:
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# 내부 호출 인증 키(test 컨텍스트 부팅용 — 운영은 env/Secrets)
ai:
  internal-api-key: test-ai-internal-key
project-analysis:
  internal-api-key: test-project-internal-key

# LambdaTokenEncryptor는 32바이트 base64 키 필요(test 고정값 재사용)
analysis:
  dispatch:
    github-aes-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

ratelimit:
  enabled: false
  proxy:
    trusted-cidrs: 127.0.0.1/32
